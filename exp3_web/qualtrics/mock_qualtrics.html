<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>Qualtrics 模擬（測試用）</title>
<style>body{font-family:sans-serif;max-width:820px;margin:20px auto;padding:0 12px}
#q{border:1px dashed #999;padding:8px;min-height:200px}#next{margin-top:12px;padding:10px 20px}
pre{background:#f4f4f4;padding:8px;font-size:12px;white-space:pre-wrap}</style></head>
<body>
<h3 id="title"></h3>
<div id="q"></div>
<button id="next" style="display:none">下一頁 →</button>
<h4>Embedded data</h4><pre id="ed"></pre>
<script>
/* 模擬 Qualtrics 的 API，讓 quiz_question.js 和 trial_question.js 原封不動地跑 */
const ED = { cond: "similar", order: "behaviorFirst", list: "2", gender: "f" };
const urlp = new URLSearchParams(location.search);
for (const k of ["cond", "order", "list", "gender"]) if (urlp.get(k)) ED[k] = urlp.get(k);
const BASE = new URL("../index.html", location.href).href;
let onload = null, unloads = [];
const Qualtrics = { SurveyEngine: {
  addOnload(fn) { onload = fn; },
  addOnUnload(fn) { unloads.push(fn); },
  setEmbeddedData(k, v) { ED[k] = v; render(); },
}};
const qObj = {
  hideNextButton() { document.getElementById("next").style.display = "none"; },
  showNextButton() { document.getElementById("next").style.display = "inline-block"; },
  getQuestionContainer() { return document.getElementById("q"); },
};
function render() { document.getElementById("ed").textContent = JSON.stringify(ED, null, 1); }
function pipe(code, lm) {
  return code.replace(/\$\{lm:\/\/Field\/1\}/g, lm)
             .replace(/\$\{e:\/\/Field\/([A-Za-z0-9_]+)\}/g, (_, k) => ED[k] ?? "")
             .replace('"https://YOUR-ACCOUNT.github.io/YOUR-REPO/"', JSON.stringify(BASE));
}
async function runQuestion(file, lm) {
  unloads.forEach(f => f()); unloads = [];
  document.getElementById("q").innerHTML = "";
  const code = await (await fetch(file)).text();
  new Function("Qualtrics", pipe(code, lm))(Qualtrics);
  onload.call(qObj);
}
function judgmentPage(n) {
  unloads.forEach(f => f()); unloads = [];
  document.getElementById("q").innerHTML =
    `<p><b>（Qualtrics 原生題目）請評估 ${ED.current_handle} 的這則貼文：</b></p>
     <blockquote>${ED.current_post_text}</blockquote>
     <p>這個行為有多不道德？ 1 … 7 <input id="mj" type="number" min="1" max="7" value="4"></p>`;
  qObj.showNextButton();
}
const pages = [
  () => runQuestion("quiz_question.js", ""),
  () => runQuestion("trial_question.js", "1"), () => judgmentPage(1),
  () => runQuestion("trial_question.js", "2"), () => judgmentPage(2),
  () => runQuestion("trial_question.js", "3"), () => judgmentPage(3),
  () => { unloads.forEach(f => f()); document.getElementById("q").innerHTML = "<p>問卷結束</p>"; qObj.hideNextButton(); },
];
let pi = 0;
function go() { document.getElementById("title").textContent = "第 " + (pi + 1) + " 頁"; pages[pi](); }
document.getElementById("next").addEventListener("click", () => { pi++; go(); });
render(); go();
</script></body></html>
